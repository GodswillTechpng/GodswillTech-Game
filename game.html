<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GodswillTech PC Challenge</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>

  <main class="game-container">
    <h1>⚙️ GodswillTech</h1>
    <h2>PC Challenge 🎮</h2>
    <p>Test your computer engineering knowledge.</p>

    <div class="game-info">
      <span id="question-number">Question 1/5</span>
      <span>Score: <b id="score">0</b></span>
      <span>Time: <b id="timer">15</b>s</span>
    </div>

    <div class="game-box">
      <h3 id="question">Loading question...</h3>
      <div id="answers"></div>
      <p id="feedback"></p>

      <button id="next-button" style="display:none;">
        Next Question →
      </button>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
