<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="GodswillTech PC Challenge - Test your computer engineering knowledge.">

  <title>GodswillTech PC Challenge</title>

  <link rel="stylesheet" href="game.css">
</head>

<body>

  <main class="game-container">

    <header>
      <h1>⚙️ GodswillTech</h1>
      <h2>PC Challenge 🎮</h2>
      <p>Test your computer engineering knowledge.</p>
    </header>

    <section class="game-info">
      <span id="question-number">Question 1/50</span>
      <span>Score: <b id="score">0</b></span>
      <span>Time: <b id="timer">15</b>s</span>
    </section>

    <section class="game-box">

      <h3 id="question">
        Loading question...
      </h3>

      <div id="answers"></div>

      <p id="feedback" aria-live="polite"></p>

      <button id="next-button" style="display: none;">
        Next Question →
      </button>

    </section>

    <footer>
      <p>Built by <strong>GodswillTech</strong> • Computer Engineering</p>
    </footer>

  </main>

  <script src="game.js"></script>

</body>
</html>
